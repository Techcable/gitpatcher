[package]
name = "gitpatcher"
description = "A library that uses git to maintain a set of patches around a repo"
version.workspace = true
edition.workspace = true
authors.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
thiserror = "2"
slog.workspace = true
slog-scope.workspace = true
duct.workspace = true
camino.workspace = true
indexmap = { version = "2", features = ["serde"] }
relative-path.workspace = true
itertools.workspace = true
walkdir = "2"
indoc = "2"
bon = "3"
shellexpand = "3"
# Remove once OnceLock::get_or_try_init is stabilized
once_cell = "1"
# for configuration
serde = { version = "1", features = ["derive"] }
toml = "1"
# for VCS operations
vcs-core.workspace = true
gix-url.workspace = true
# needed because of vcs_core
tokio = { version = "1", features = ["rt"] }
# Used to more quickly apply patches, without spawning a subprocess
diffy = "0.5"

[features]
# Add backtraces to error types
#
# Currently requires nightly feature `error_generic_member_access`.
# On stable rust, this feature is automatically disabled.
backtrace = []

[build-dependencies]
rustversion-detect = "0.2"

[dev-dependencies]
anyhow = "1"
testdir = "0.10"

[lints]
workspace = true

[package.metadata.cargo-shear]
ignored-paths = [
    # not actually project code
    "tests/data/**",
]
