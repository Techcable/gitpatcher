[graph]
all-features = true
no-default-features = false
features = []

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
private.ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"
workspace-default-features = "allow"
# Forbid these dependencies from being used
deny = []
# Skip these crates when doing duplicate detections
skip = [
    "windows-sys",
]
# Skip these crates and all their dependencies
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
